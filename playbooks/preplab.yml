---
- name: Deploy WAN & Host configurations
  hosts: "{{ target_hosts }}"
  gather_facts: false

  tasks:

    - name: Import Global Vars
      ansible.builtin.include_vars: "{{ item }}"
      with_items:
        - "../group_vars/global.yml"

    - name: load configuration from file
      arista.eos.eos_config:
        src: ../host_configs/{{inventory_hostname}}.cfg
        replace: line

# CloudVision onboarding + tags for lab host/endpoint devices.
# These devices are not part of the AVD fabric inventory/eos_designs pipeline,
# so they never receive metadata.cv_tags. This play uses cv_deploy in
# "cv_deploy-only" mode (read_structured_config_from_file: false) to assign
# CloudVision device tags directly. eos_config_dir is pointed at the existing
# host_configs/ directory (instead of the default intended/configs, which is
# never generated for these devices) so cv_deploy pushes the same .cfg
# already applied above via eos_config as the device's flat-layout configlet.
#
# cv_device_tags is defined per-host directly in host_configs/inventory.yml
# rather than templated here from inventory_hostname: cv_deploy's internal
# per-device hostvars resolution (used only for cv_deploy-only schema keys
# like cv_device_tags) did not pick up a play-level `vars:` value with
# cross-host Jinja, even for the host actually running the delegated task
# (verified via cv_register_detailed_results - device_tags came back empty
# for every device). Plain inventory host_vars resolve reliably instead.
- name: Tag host/endpoint devices on CloudVision
  hosts: "{{ target_hosts }}"
  connection: local
  gather_facts: false

  vars:
    read_structured_config_from_file: false
    eos_config_dir: "{{ inventory_dir }}"

  tasks:
    - name: Deploy CloudVision tags for lab host/endpoint devices
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
