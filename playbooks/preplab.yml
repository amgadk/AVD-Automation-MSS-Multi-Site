---
- name: Deploy WAN & Host configurations
  hosts: "{{ target_hosts }}"
  gather_facts: false

  tasks:

    - name: Import Global Vars
      ansible.builtin.include_vars: "{{ item }}"
      with_items:
        - "../group_vars/global.yml"

    - name: load configuration from file
      arista.eos.eos_config:
        src: ../host_configs/{{inventory_hostname}}.cfg
        replace: line

# Tags-only CloudVision onboarding for lab host/endpoint devices.
# These devices are not part of the AVD fabric inventory/eos_designs pipeline,
# so they never receive metadata.cv_tags. This play uses cv_deploy in
# "cv_deploy-only" mode (read_structured_config_from_file: false) to assign
# CloudVision device tags directly, without touching config deployment
# (cv_use_static_config_manifest: true skips the flat-layout configlet push,
# since host configs are already pushed above via eos_config).
- name: Tag host/endpoint devices on CloudVision
  hosts: "{{ target_hosts }}"
  connection: local
  gather_facts: false

  vars:
    read_structured_config_from_file: false
    cv_use_static_config_manifest: true
    # Hostnames follow c<site>-<Department>-H<n>, e.g. c1-Staff-H1.
    cv_device_tags:
      - name: Campus
        value: ACME-AU
      - name: Campus-Pod
        value: "CAMPUS{{ inventory_hostname.split('-')[0][1:] }}"
      - name: Department
        value: "{{ inventory_hostname.split('-')[1] }}"
      - name: Role
        value: Endpoint

  tasks:
    - name: Deploy CloudVision tags for lab host/endpoint devices
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
